name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  publication-gate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check sanitized publication
        shell: pwsh
        run: ./scripts/check-publication.ps1

  backend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compile backend
        working-directory: backend
        run: mvn -B -DskipTests package

  frontend-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [sky-web-admin, sky-web-user]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/${{ matrix.project }}/package-lock.json
      - name: Install dependencies
        working-directory: frontend/${{ matrix.project }}
        run: npm ci
      - name: Type check
        working-directory: frontend/${{ matrix.project }}
        run: npm run type-check
      - name: Unit tests
        working-directory: frontend/${{ matrix.project }}
        run: npm test
      - name: Production build
        working-directory: frontend/${{ matrix.project }}
        run: npm run build
